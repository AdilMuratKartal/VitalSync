<!-- Interactive Micro-Interactions Script -->
<script>
  function updateTcCount(input) {
    const rawVal = input.value.replace(/[^0-9]/g, '');
    input.value = rawVal.slice(0, 11);
    const counter = document.getElementById('tc-counter');
    counter.textContent = `${input.value.length}/11`;
    if (input.value.length === 11) {
      counter.classList.add('text-primary', 'font-semibold');
      counter.classList.remove('text-outline');
    } else {
      counter.classList.remove('text-primary', 'font-semibold');
      counter.classList.add('text-outline');
    }
  }

  function formatPhoneNumber(input) {
    let x = input.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
    if (!x[2]) {
      input.value = !x[1] ? '' : x[1];
    } else {
      input.value = !x[3] 
        ? `${x[1]} (${x[2]}` 
        : `${x[1]} (${x[2]}) ${x[3]}` + (x[4] ? ` ${x[4]}` : '') + (x[5] ? ` ${x[5]}` : '');
    }
  }

  function togglePasswordVisibility(id, btn) {
    const field = document.getElementById(id);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (field.type === 'password') {
      field.type = 'text';
      icon.textContent = 'visibility_off';
      btn.classList.add('text-primary');
      btn.classList.remove('text-outline');
    } else {
      field.type = 'password';
      icon.textContent = 'visibility';
      btn.classList.remove('text-primary');
      btn.classList.add('text-outline');
    }
  }

  function checkPasswordStrength(val) {
    const hasLen = val.length >= 8;
    const hasAlphaNum = /[A-Za-z]/.test(val) && /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);

    const ruleLength = document.getElementById('rule-length');
    const ruleChar = document.getElementById('rule-char');
    const b1 = document.getElementById('bar-1');
    const b2 = document.getElementById('bar-2');
    const b3 = document.getElementById('bar-3');
    const label = document.getElementById('strength-label');

    // Rule 1: Length
    if (hasLen) {
      ruleLength.className = 'flex items-center gap-1 text-primary font-medium';
      ruleLength.querySelector('span').textContent = 'check_circle';
    } else {
      ruleLength.className = 'flex items-center gap-1 text-outline';
      ruleLength.querySelector('span').textContent = 'circle';
    }

    // Rule 2: Letter & Number
    if (hasAlphaNum) {
      ruleChar.className = 'flex items-center gap-1 text-primary font-medium';
      ruleChar.querySelector('span').textContent = 'check_circle';
    } else {
      ruleChar.className = 'flex items-center gap-1 text-outline';
      ruleChar.querySelector('span').textContent = 'circle';
    }

    // Gauge Level
    let score = 0;
    if (hasLen) score++;
    if (hasAlphaNum) score++;
    if (hasSpecial && val.length >= 10) score++;

    b1.className = 'h-full w-1/3 rounded-full transition-colors duration-300 ' + (score >= 1 ? 'bg-secondary-fixed-dim' : 'bg-outline-variant');
    b2.className = 'h-full w-1/3 rounded-full transition-colors duration-300 ' + (score >= 2 ? 'bg-primary' : 'bg-outline-variant');
    b3.className = 'h-full w-1/3 rounded-full transition-colors duration-300 ' + (score >= 3 ? 'bg-primary-container' : 'bg-outline-variant');

    if (score === 0) {
      label.textContent = 'Gerekli';
      label.className = 'font-semibold text-outline';
    } else if (score === 1) {
      label.textContent = 'Zayıf';
      label.className = 'font-semibold text-error';
    } else if (score === 2) {
      label.textContent = 'Güvenli';
      label.className = 'font-semibold text-primary';
    } else {
      label.textContent = 'Çok Güçlü';
      label.className = 'font-semibold text-primary-container';
    }
  }
</script></main>
