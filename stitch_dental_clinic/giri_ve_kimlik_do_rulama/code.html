: ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "title-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-xl-mobile": ["28px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "700" }], "body-md": ["15px", { lineHeight: "20px", fontWeight: "400" }], "headline-lg": ["24px", { lineHeight: "30px", letterSpacing: "-0.01em", fontWeight: "600" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "600" }], "headline-md": ["20px", { lineHeight: "26px", letterSpacing: "-0.005em", fontWeight: "600" }], "headline-xl": ["34px", { lineHeight: "41px", letterSpacing: "-0.02em", fontWeight: "700" }], "body-lg": ["17px", { lineHeight: "24px", fontWeight: "400" }], "title-sm": ["17px", { lineHeight: "22px", fontWeight: "600" }], "label-md": ["13px", { lineHeight: "18px", fontWeight: "500" }] } } } };</script><style>@layer base { html, body { width: 100%; margin: 0; padding: 0; background-color: #faf8ff; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col"><main class="flex flex-col relative w-full bg-surface flex-1"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Subtle Ambient Glow Orbs -->

<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Clinic Branding Header -->

<div class="relative flex items-center justify-center w-24 h-24 rounded-full bg-surface-container-low shadow-sm mb-space-sm p-2">
<div class="w-20 h-20 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center overflow-hidden">
<img alt="Dentora Dental Clinic Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/ALJJyrCQEWv3EyM8-BrxpNFcdcHaS9qit8RmIcV0M1b1ISpCMCZgDRdGVyaX91QXsGuRnteHej2GRs4Td8j9oU2suG8fFZmjR4x2SZZSQoTaQQ1FDltJ0t79iy1s56TFFdrXRG1EtcLMUPBIWo8jBQg6UteHTw2q6t_hF8GkW9JRZTBW3AnE-e-pWzcG6UZ2_7E0l_vGo7K5MeBQyEV36jadvRiGoldouYVnMBj9ZhVhxTy9">
</div>
<span class="absolute bottom-1 right-2 flex h-3.5 w-3.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-fixed-dim opacity-75"></span>
<span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-primary"></span>
</span>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Dentora Dental Clinic</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Sağlıklı Gülüşler İçin Birlikteyiz</p>
</header>
<!-- Role Switcher Toggle (Segmented Control) -->
<nav aria-label="Giriş Tipi Seçimi" class="w-full bg-surface-container-high p-1 rounded-full flex relative mb-space-lg shadow-sm">
<button aria-selected="true" class="flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-300 bg-surface-container-lowest text-primary shadow-sm" id="btn-role-patient" onclick="switchRole('patient')" role="tab" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &quot;FILL&quot; 1;">person</span>
<span>Hasta Girişi</span>
</button>
<button aria-selected="false" class="flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-300 text-on-surface-variant" id="btn-role-doctor" onclick="switchRole('doctor')" role="tab" type="button">
<span class="material-symbols-outlined text-[18px]">stethoscope</span>
<span>Doktor Girişi</span>
</button>
</nav>
<!-- Authentication Main Card -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm flex flex-col gap-space-md">
<!-- Doctor Alert Notice (Hidden by Default) -->
<div class="bg-secondary-container/15 p-3 rounded-DEFAULT flex items-center gap-2.5 text-on-secondary-container hidden" id="doctor-notice">
<span class="material-symbols-outlined text-primary text-[20px]">verified_user</span>
<p class="font-label-sm text-label-sm leading-snug">Kurumsal hekim paneli yetkili personel erişimi içindir.</p>
</div>
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- TC Kimlik Input Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-between" for="tc-input">
<span id="id-label-text">T.C. Kimlik No</span>
<span class="text-outline font-label-sm text-label-sm" id="tc-counter">0/11</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">badge</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-11 pr-11 py-3.5 rounded-DEFAULT placeholder:text-outline/70 focus:outline-none focus:bg-surface-container-lowest transition-all" id="tc-input" inputmode="numeric" maxlength="11" oninput="handleTcInput(this)" placeholder="11 haneli TC Kimlik Numaranız" type="tel">
<div class="absolute right-3.5 flex items-center justify-center text-primary opacity-0 transition-opacity" id="tc-valid-icon">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</div>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password-input">Şifre</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-11 pr-11 py-3.5 rounded-DEFAULT placeholder:text-outline/70 focus:outline-none focus:bg-surface-container-lowest transition-all" id="password-input" placeholder="••••••••" type="password">
<button aria-label="Şifreyi Göster" class="absolute right-3.5 flex items-center justify-center text-outline hover:text-on-surface focus:outline-none transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Switch & Forgot Password Link -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<div class="relative inline-flex items-center">
<input checked="" class="sr-only peer" id="remember-me" type="checkbox">
<div class="w-10 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-surface-container-lowest after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
<span class="font-label-md text-label-md text-on-surface">Beni Hatırla</span>
</label>

<a href="#" class="font-label-md text-label-md text-primary font-medium hover:underline cursor-pointer active:opacity-80 transition-opacity">Şifremi Unuttum?</a></div>
<!-- Primary Action Button: Giriş Yap -->
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-4 rounded-full shadow-md flex items-center justify-center gap-2 mt-2 active:scale-[0.98] transition-transform" type="submit">
<span>Giriş Yap</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider with Frosted Badge -->

<!-- Secondary Action: E-Devlet ile Giriş Yap -->

</form>
</div>
<!-- Registration & Support Footer -->
<footer class="mt-space-lg flex flex-col items-center gap-space-xs text-center">
<div class="flex items-center gap-1.5 font-body-md text-body-md text-on-surface-variant flex-wrap justify-center">
<span>Kliniğimizde ilk defa mı tedavi olacaksınız?</span>
<a class="text-primary font-semibold inline-flex items-center gap-0.5 active:underline" href="#">
<span>Kayıt Ol</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</div>
<!-- Quick Emergency Consultation Micro-Pill -->
<a class="mt-space-sm inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-error-container/40 text-on-error-container active:scale-95 transition-all" href="tel:4440000">
<span class="flex h-2 w-2 rounded-full bg-error animate-pulse"></span>
<span class="font-label-sm text-label-sm">Acil Diş Ağrısı Hattı: 444 0 DENT</span>
</a>
</footer>
</div>
</div>
<script>
  function switchRole(role) {
    const btnPatient = document.getElementById('btn-role-patient');
    const btnDoctor = document.getElementById('btn-role-doctor');
    const doctorNotice = document.getElementById('doctor-notice');
    const idLabelText = document.getElementById('id-label-text');
    const tcInput = document.getElementById('tc-input');

    if (role === 'doctor') {
      btnPatient.className = 'flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-300 text-on-surface-variant';
      btnPatient.setAttribute('aria-selected', 'false');

      btnDoctor.className = 'flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-300 bg-surface-container-lowest text-primary shadow-sm';
      btnDoctor.setAttribute('aria-selected', 'true');

      doctorNotice.classList.remove('hidden');
      idLabelText.textContent = 'Kurumsal Personel / T.C. No';
      tcInput.placeholder = 'Hekim Sicil veya TC No';
    } else {
      btnDoctor.className = 'flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-300 text-on-surface-variant';
      btnDoctor.setAttribute('aria-selected', 'false');

      btnPatient.className = 'flex-1 py-2.5 px-4 rounded-full font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-300 bg-surface-container-lowest text-primary shadow-sm';
      btnPatient.setAttribute('aria-selected', 'true');

      doctorNotice.classList.add('hidden');
      idLabelText.textContent = 'T.C. Kimlik No';
      tcInput.placeholder = '11 haneli TC Kimlik Numaranız';
    }
  }

  function handleTcInput(input) {
    input.value = input.value.replace(/[^0-9]/g, '');
    const length = input.value.length;
    const counter = document.getElementById('tc-counter');
    const validIcon = document.getElementById('tc-valid-icon');

    counter.textContent = length + '/11';

    if (length === 11) {
      validIcon.classList.remove('opacity-0');
      validIcon.classList.add('opacity-100');
    } else {
      validIcon.classList.add('opacity-0');
      validIcon.classList.remove('opacity-100');
    }
  }

  function togglePassword() {
    const passwordInput = document.getElementById('password-input');
    const toggleIcon = document.getElementById('password-toggle-icon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      toggleIcon.textContent = 'visibility';
    }
  }
</script></main>



</body></html>
